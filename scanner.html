<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>Escáner de trabajadores</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    .contenedor {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    h2 {
      margin: 5px 0;
      font-size: 21px;
    }

    .subtitulo {
      color: #bbb;
      font-size: 14px;
      margin-bottom: 15px;
    }

    #reader {
      width: 100%;
      background: black;
      border-radius: 12px;
      overflow: hidden;
    }

    .estado {
      margin-top: 15px;
      padding: 13px;
      border-radius: 8px;
      background: #222;
      font-size: 14px;
      line-height: 1.4;
    }

    .estado.ok {
      background: #173d24;
      color: #8ff0a4;
    }

    .estado.error {
      background: #451919;
      color: #ffb4b4;
    }

    button {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 9px;
      margin-top: 12px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .cerrar {
      background: #444;
      color: white;
    }

    .contador {
      text-align: center;
      margin-top: 12px;
      color: #ccc;
      font-size: 14px;
    }

  </style>

</head>


<body>

<div class="contenedor">

  <h2>📷 Escanear trabajadores</h2>

  <div class="subtitulo">
    Apunta la cámara al código de barras Code 128.
  </div>

  <div id="reader"></div>

  <div
    id="estado"
    class="estado">

    Iniciando cámara...

  </div>

  <div
    id="contador"
    class="contador">

    Trabajadores escaneados: 0

  </div>

  <button
    class="cerrar"
    onclick="cerrarScanner()">

    CERRAR ESCÁNER

  </button>

</div>


<script>

  let scanner = null;

  let activo = false;

  let ultimoCodigo = '';

  let ultimoTiempo = 0;

  let cantidadEscaneados = 0;


  /*
   * Iniciar cámara
   */

  function iniciarScanner() {

    scanner =
      new Html5Qrcode('reader');


    const configuracion = {

      fps: 10,

      qrbox: {
        width: 300,
        height: 120
      },

      formatsToSupport: [
        Html5QrcodeSupportedFormats.CODE_128
      ]

    };


    scanner.start(

      {
        facingMode: 'environment'
      },

      configuracion,

      function(decodedText) {

        procesarCodigo(decodedText);

      },

      function(errorMessage) {

        // Los errores normales de lectura
        // se ignoran.

      }

    )

    .then(function() {

      activo = true;

      cambiarEstado(
        'Cámara activa. Escanea un trabajador.',
        ''
      );

    })

    .catch(function(error) {

      activo = false;

      cambiarEstado(
        'No se pudo acceder a la cámara. ' +
        'Verifica los permisos del navegador.',
        'error'
      );

      console.error(error);

    });

  }


  /*
   * Procesar código
   */

  function procesarCodigo(codigo) {

    codigo =
      String(codigo || '').trim();

    if (!codigo) {
      return;
    }


    /*
     * Evita que la cámara detecte
     * repetidamente el mismo código.
     */

    const ahora = Date.now();

    if (
      codigo === ultimoCodigo &&
      ahora - ultimoTiempo < 2500
    ) {

      return;

    }


    ultimoCodigo = codigo;

    ultimoTiempo = ahora;

    cantidadEscaneados++;

    document.getElementById(
      'contador'
    ).textContent =
      'Trabajadores escaneados: ' +
      cantidadEscaneados;


    cambiarEstado(
      'Código leído: ' +
      codigo +
      ' ✓',
      'ok'
    );


    /*
     * Enviar código a la ventana
     * principal de Apps Script.
     *
     * NO cerramos la ventana.
     * La cámara continúa funcionando.
     */

    if (window.opener) {

      window.opener.postMessage(

        {
          type: 'CODE128_SCAN',
          code: codigo
        },

        '*'

      );

    }

  }


  /*
   * Mostrar estado
   */

  function cambiarEstado(texto, tipo) {

    const estado =
      document.getElementById('estado');

    estado.textContent = texto;

    estado.className =
      'estado ' + tipo;

  }


  /*
   * Cerrar correctamente la cámara
   */

  function cerrarScanner() {

    if (!scanner) {

      window.close();

      return;

    }


    scanner.stop()

      .then(function() {

        activo = false;

        window.close();

      })

      .catch(function() {

        window.close();

      });

  }


  /*
   * Iniciar automáticamente
   */

  window.addEventListener(
    'load',
    iniciarScanner
  );

</script>

</body>

</html>
